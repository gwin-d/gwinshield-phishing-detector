<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GwinShield</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <div class="header">
    <div class="brand">
      <img src="icons/icon48.png" alt="GwinShield" class="brand-logo" style="border-radius:10px;width:36px;height:36px;" />
      <div>
        <div class="brand-name">GwinShield</div>
        <div class="brand-tagline">AI Phishing Detection · by Gwin D</div>
      </div>
    </div>
    <div class="api-badge">
      <div class="dot" id="statusDot"></div>
      <span id="statusText" style="color:#94A3B8">Checking</span>
    </div>
  </div>

  <div class="url-strip">
    <span class="url-icon">🔗</span>
    <div class="url-text" id="currentUrl">Loading...</div>
  </div>

  <div id="loadingState" class="loading">
    <div class="spinner-wrap">
      <div class="spinner-outer"></div>
      <div class="spinner-inner"></div>
    </div>
    <div class="loading-text">Analysing URL with AI...</div>
  </div>

  <div id="verdictState" style="display:none;" class="verdict-wrap">
    <div class="verdict-card" id="verdictCard">
      <div class="verdict-top">
        <div class="verdict-left">
          <div class="verdict-emoji" id="verdictEmoji"></div>
          <div>
            <div class="verdict-label">Verdict</div>
            <div class="verdict-text" id="verdictText"></div>
          </div>
        </div>
        <div class="threat-badge" id="threatBadge"></div>
      </div>

      <div class="scores">
        <div class="score-row">
          <div class="score-label">Hybrid Score</div>
          <div class="bar-bg">
            <div class="bar-fill" id="hybridBar" style="width:0%"></div>
          </div>
          <div class="score-pct" id="hybridPct">0%</div>
        </div>
        <div class="score-row">
          <div class="score-label">ML Score</div>
          <div class="bar-bg">
            <div class="bar-fill" id="mlBar"
              style="width:0%;background:#1565C0"></div>
          </div>
          <div class="score-pct" id="mlPct" style="color:#1565C0">0%</div>
        </div>
        <div class="score-row">
          <div class="score-label">Heuristic Score</div>
          <div class="bar-bg">
            <div class="bar-fill" id="hBar"
              style="width:0%;background:#00B4D8"></div>
          </div>
          <div class="score-pct" id="hPct" style="color:#00B4D8">0%</div>
        </div>
      </div>

      <div id="flagsWrap" class="flags-wrap"></div>
    </div>
  </div>

  <div id="errorState" class="error-state" style="display:none;">
    <div class="error-emoji">⚠️</div>
    <div class="error-title">Could not analyse this page</div>
    <div class="error-msg" id="errorMsg">
      Make sure the GwinShield API is running on your computer.
    </div>
    <button class="retry-btn" id="retryBtn">Try Again</button>
  </div>

  <div class="popup-footer">
    <a class="portal-link" href="http://localhost:5173" target="_blank">
      Open Web Portal →
    </a>
    <div class="scan-meta" id="scanMeta"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
